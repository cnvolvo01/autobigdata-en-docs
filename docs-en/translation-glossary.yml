# Project glossary for Chinese automotive-data concepts in the English site.
# The checker reads the source/preferred/avoid fields below; notes guide human review.
- source: "三电"
  preferred: "three-electric systems (traction battery, electric drive, and electronic control)"
  avoid: "three electrics"
  notes: "Use the short form three-electric systems after the first explanation."
  notes_zh: "首次出现应解释为动力电池、电驱和电控系统，后文再使用简短形式。"
- source: "过户"
  preferred: "vehicle ownership transfer"
  avoid: "title transfer"
  notes: "Do not imply the U.S. legal title process when describing Chinese insurance or transfer records."
  notes_zh: "中国语境中的过户记录不等同于美国法律意义上的车辆产权证转移流程。"
- source: "上险量"
  preferred: "first-time compulsory-insurance registrations"
  avoid: "insured sales"
  notes: "Use insured registrations only when the source explicitly frames the metric as a sales proxy."
  notes_zh: "只有中文原稿明确把该指标作为销量代理时，才可以使用 insured registrations 等表达。"
- source: "汽车保有量"
  preferred: "vehicle parc (vehicles in operation)"
  avoid: "vehicle population"
  notes: "Vehicle parc is the industry term; explain it on first use."
  notes_zh: "vehicle parc 是行业常用词，首次出现时应解释为在运营车辆规模。"
- source: "新能源车"
  preferred: "new-energy vehicle (NEV)"
  avoid: "new energy vehicle"
  notes: "Use NEV after the first definition."
  notes_zh: "首次写出 new-energy vehicle (NEV)，后文使用 NEV。"
- source: "智驾"
  preferred: "advanced driver-assistance systems (ADAS)"
  avoid: "intelligent driving"
  notes: "Use smart-driving only when the Chinese source clearly describes a broader feature set."
  notes_zh: "如果中文原稿指的是辅助驾驶配置，应使用 ADAS；只有更宽泛的功能集合才使用 smart-driving。"
- source: "二网"
  preferred: "secondary-channel wholesale"
  avoid: "secondary network"
  notes: "Add a short explanation for readers unfamiliar with China's independent dealer channel."
  notes_zh: "应补充中国独立经销商渠道的解释，避免美国读者把二网理解成网络基础设施。"
- source: "交强险"
  preferred: "China's compulsory motor vehicle liability insurance"
  notes: "The short form is acceptable after the China-specific definition."
  notes_zh: "首次出现应说明这是中国的强制机动车责任保险，后文可以使用简短形式。"
- source: "商业险"
  preferred: "commercial auto insurance"
  avoid: "commercial insurance"
  notes: "Use the auto qualifier where the surrounding text could be ambiguous."
  notes_zh: "在可能产生歧义的地方应明确写成 commercial auto insurance。"
- source: "4S店"
  preferred: "authorized 4S dealership"
  avoid: "4S store"
  notes: "Explain the China-specific authorized dealership model on first use."
  notes_zh: "首次出现应解释 4S 是中国特有的授权经销商体系。"
